name: HealthSpike
options:
  bundleIdPrefix: dev.cosmichomeless
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    DEVELOPMENT_TEAM: X8H9Y77VL5
    CURRENT_PROJECT_VERSION: "1"
packages:
  # Gemma 4 en el propio iPhone (modelo opcional del chat del Coach).
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  HealthSpike:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - path: Resources
        optional: true
    dependencies:
      - target: HealthWidgets
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    entitlements:
      path: Config/HealthSpike.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.cosmichomeless.healthspike]
        com.apple.developer.kernel.increased-memory-limit: true   # Gemma 4 E2B ocupa unos 3,5 GB en memoria
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cosmichomeless.healthspike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/HealthSpike-Info.plist      # tareas en segundo plano (BackgroundRefresh)
        TARGETED_DEVICE_FAMILY: "1"      # solo iPhone (vertical)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Health Spike"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Se usa para leer directamente de tu pulsera Fitbit Air (pulso en vivo) sin pasar por Google."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  HealthWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: [Info.plist]
      - Shared
    entitlements:
      path: Config/HealthWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.cosmichomeless.healthspike]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cosmichomeless.healthspike.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Health Spike"
        SKIP_INSTALL: YES
schemes:
  HealthSpike:
    build:
      targets:
        HealthSpike: all
    run:
      config: Debug
